name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/*, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PDF Tag Simple ${{ github.ref_name }}
          releaseDraft: true

      # Release notes = .msi download link + this version's CHANGELOG.md section, then publish.
      - name: Write release notes and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          api="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          msi=$(gh api "$api" --jq '.assets[] | select(.name | endswith(".msi")) | .name' | head -1)
          [ -n "$msi" ] || { echo "No .msi asset on the release"; exit 1; }
          changes=$(awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          [ -n "$changes" ] || { echo "No CHANGELOG.md section for ${TAG#v}"; exit 1; }
          {
            echo "## Download"
            echo
            echo "Download **[$msi](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$msi)** and run it."
            echo "The installer isn't code-signed: if Windows SmartScreen warns you, click **More info → Run anyway**."
            echo
            echo "## What's in this release"
            echo "$changes"
          } > notes.md
          gh api -X PATCH "$api" -F body=@notes.md -F draft=false
