<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Tag Simple</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!--
    LAYOUT
    ├── <aside.sidebar>
    │     ├── .sidebar-inner (scrolls)
    │     │     ├── .brand-block        — logo + status
    │     │     ├── .toolbar            — action buttons (2 col grid)
    │     │     ├── #sidebar-folders    — f_sidebar.js
    │     │     └── #tag-list-container — f_tags.js
    │     └── #btn-trash-view     — main.js (pinned to bottom, outside sidebar-inner)
    └── <main.main-panel>
          ├── .main-toolbar       — search + bulk actions + sort + dark toggle
          └── .grid-scroll-area
                └── #asset-grid  — f_grid.js
  -->
  <div class="app-shell">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <div class="sidebar-inner">

        <!-- Brand + Status -->
        <div class="brand-block">
          <div class="brand-title">
            <!-- Logo SVG — thay bằng file svg của bạn sau -->
            <img src="./assets/logo.svg" width="28" height="28" style="flex-shrink:0;" />
            PDF Tag Simple
          </div>
          <!-- Status — ghi bởi main.js → setStatus() -->
          <div id="txt-status" class="status-text">Ready.</div>
        </div>

        <!-- Toolbar buttons — sự kiện gắn trong main.js -->
        <div class="sidebar-section">
          <div class="toolbar">
            <button id="btn-update-db">
              <!-- icon: refresh -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              Update DB
            </button>
            <button id="btn-ai-autotag">
              <!-- icon: sparkles -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L9.5 9.5 3 12l6.5 2.5L12 21l2.5-6.5L21 12l-6.5-2.5z"/></svg>
              AI auto
            </button>
            <button id="btn-find-duplicates" class="full-width">
              <!-- icon: copy -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Find Duplicates
            </button>
          </div>
        </div>

        <!-- Folder list — render bởi f_sidebar.js -->
        <div class="sidebar-section">
          <div class="section-title">Folders</div>
          <div id="sidebar-folders"></div>
        </div>

        <!-- Tag filter — render bởi f_tags.js -->
        <div class="sidebar-section">
          <div class="section-title">Filter by Tags</div>
          <input id="tag-search-input" placeholder="Search tags..." style="margin-bottom:8px;" />
          <div id="tag-list-container" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
        </div>

      </div>

      <!-- Trash + Settings — pinned to the bottom of the sidebar -->
      <div class="sidebar-footer">
        <button id="btn-trash-view" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Trash (<span id="txt-trash-count">0</span>)
        </button>
        <button id="btn-settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>

    </aside>
    <!-- =================== END SIDEBAR =================== -->

    <!-- ====================== MAIN ======================= -->
    <main class="main-panel">

      <!-- Top toolbar -->
      <div class="main-toolbar">

        <!-- Thu gọn / mở sidebar (Ctrl+B) — main.js toggleSidebar() -->
        <button id="btn-toggle-sidebar" title="Hide sidebar (Ctrl+B)" style="flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0 8px;">
          <!-- icon: panel-left -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>

        <!-- "Continue reading" — only shown in Read Mode "open-reader" when there's a
             saved position (see main.js updateJumpLastButton / f_reader.js LAST_READ_KEY).
             The arrow opens a dropdown with the last up-to-3 books read. -->
        <div style="display:flex; flex-shrink:0;">
          <button id="btn-jump-last" style="display:none; white-space:nowrap; flex-shrink:0; border-top-right-radius:0; border-bottom-right-radius:0;">↻ Continue reading</button>
          <button id="btn-jump-last-arrow" title="Recently read" style="display:none; flex-shrink:0; padding:0 6px; border-left:none; border-top-left-radius:0; border-bottom-left-radius:0;">▾</button>
        </div>

        <!-- Search -->
        <input id="search-input" placeholder="Search books..." style="flex:1; min-width:180px;" />

        <!-- Bulk actions — ẩn mặc định, main.js điều khiển -->
        <span id="txt-selection-count" style="font-size:12px; color:var(--text-secondary); white-space:nowrap;">0 selected</span>
        <button id="btn-select-all">Select all</button>
        <button id="btn-bulk-hide" style="display:none;">Hide</button>
        <button id="btn-bulk-restore" style="display:none;">Restore</button>
        <button id="btn-clear-selection" style="display:none;">Clear</button>

        <!-- Sort -->
        <select id="sort-select">
          <option value="name-asc">Name A → Z</option>
          <option value="name-desc">Name Z → A</option>
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="missing-short">Missing short description first</option>
          <option value="missing-long">Missing long description first</option>
        </select>

        <!-- Dark mode toggle — main.js gắn event -->
        <!-- Card nhỏ / card lớn (setting "Show short description") — main.js setLargeCards() -->
        <!-- Chuyển nhanh Behaviour (giống Settings > General > Behaviour) — main.js -->
        <button id="btn-behaviour" title="Behaviour" style="flex-shrink:0; white-space:nowrap;"></button>
        <button id="btn-card-size-toggle" title="Large cards" style="flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0 8px;"></button>
        <button id="btn-theme-toggle" title="Toggle dark mode">🌙</button>

      </div>

      <!-- Grid -->
      <div class="grid-scroll-area">
        <div id="asset-grid" class="asset-grid"></div>
      </div>

    </main>

    <!-- ================== SUMMARY PANEL ================== -->
    <!-- Behaviour = "Summary view": click 1 sách → chi tiết hiện ở đây (f_summary.js) -->
    <aside id="summary-panel" class="summary-panel"></aside>
    <!-- ==================== END MAIN ==================== -->

  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
