[package]
name = "pdf-tag"
version = "1.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
walkdir = "2"
pdfium-render = { version = "0.8", features = ["image", "sync"] }
image = "0.25"
sha1 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
# Sign in with ChatGPT (OAuth PKCE + loopback callback + ID token verification)
sha2 = "0.10"
getrandom = "0.2"
url = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
jsonwebtoken = "9"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
